[project]
name = "anthrobbic-api"
version = "0.1.0"
description = "FastAPI service for anthrobbic"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162,<1",
    "pydantic-settings>=2,<3",
    "supabase>=2.33,<3",
    "uvicorn[standard]>=0.54,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
